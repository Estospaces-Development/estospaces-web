server {
  listen 3000;
  server_tokens off;
  client_header_buffer_size 16k;
  large_client_header_buffers 8 32k;
  root /usr/share/nginx/html;
  index index.html;

  include /etc/nginx/snippets/security-headers.conf;

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri $uri/ /index.html;
  }

  location = /index.html {
    include /etc/nginx/snippets/security-headers.conf;
    expires -1;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  }

  location ~* \.html$ {
    include /etc/nginx/snippets/security-headers.conf;
    expires -1;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    include /etc/nginx/snippets/security-headers.conf;
    expires 1y;
    add_header Cache-Control "public, immutable" always;
  }

  location /__dev_proxy/core/ {
    proxy_pass http://core-service:8080/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /__dev_proxy/booking/ {
    proxy_pass http://booking-service:8081/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /__dev_proxy/payment/ {
    proxy_pass http://payment-service:8082/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /__dev_proxy/notification/ {
    proxy_pass http://notification-service:8083/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /__dev_proxy/search/ {
    proxy_pass http://search-service:8084/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /__dev_proxy/media/ {
    proxy_pass http://media-service:8085/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /__dev_proxy/messaging/ {
    proxy_pass http://messaging-service:8086/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
