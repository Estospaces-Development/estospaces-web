server {
  listen 3000;
  server_tokens off;
  client_header_buffer_size 16k;
  large_client_header_buffers 8 32k;
  root /usr/share/nginx/html;
  index index.html;
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  include /etc/nginx/snippets/security-headers.conf;

  location ~* \.map$ {
    include /etc/nginx/snippets/security-headers.conf;
    return 404;
  }

  location ~ ^/(login|register|forgot-password|reset-password|verify-email)/?$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files /index.html =404;
  }

  location = /health {
    include /etc/nginx/snippets/security-headers.conf;
    default_type application/json;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    return 200 '{"status":"ok","service":"estospaces-web"}';
  }

  location = /client-geo.json {
    include /etc/nginx/snippets/security-headers.conf;
    default_type application/json;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    return 200 '{"countryCode":"$http_cf_ipcountry","cloudflareCountry":"$http_cf_ipcountry","appEngineCountry":"$http_x_appengine_country","acceptLanguage":"$http_accept_language"}';
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri $uri/ /index.html;
  }

  location = /index.html {
    include /etc/nginx/snippets/security-headers.conf;
    expires -1;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  }

  location ~* \.html$ {
    include /etc/nginx/snippets/security-headers.conf;
    expires -1;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    include /etc/nginx/snippets/security-headers.conf;
    expires 1y;
    add_header Cache-Control "public, immutable" always;
  }

  location /__dev_proxy/core/ {
    set $core_upstream core-service:8080;
    rewrite ^/__dev_proxy/core/(.*)$ /$1 break;
    proxy_pass http://$core_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /__dev_proxy/booking/ {
    set $booking_upstream booking-service:8081;
    rewrite ^/__dev_proxy/booking/(.*)$ /$1 break;
    proxy_pass http://$booking_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /__dev_proxy/payment/ {
    set $payment_upstream payment-service:8082;
    rewrite ^/__dev_proxy/payment/(.*)$ /$1 break;
    proxy_pass http://$payment_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /__dev_proxy/notification/ {
    set $notification_upstream notification-service:8083;
    rewrite ^/__dev_proxy/notification/(.*)$ /$1 break;
    proxy_pass http://$notification_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /__dev_proxy/search/ {
    set $search_upstream search-service:8084;
    rewrite ^/__dev_proxy/search/(.*)$ /$1 break;
    proxy_pass http://$search_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /__dev_proxy/media/ {
    set $media_upstream media-service:8085;
    rewrite ^/__dev_proxy/media/(.*)$ /$1 break;
    proxy_pass http://$media_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /__dev_proxy/messaging/ {
    set $messaging_upstream messaging-service:8086;
    rewrite ^/__dev_proxy/messaging/(.*)$ /$1 break;
    proxy_pass http://$messaging_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
