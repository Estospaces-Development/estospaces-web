server {
  listen 3000;
  server_tokens off;
  client_header_buffer_size 16k;
  large_client_header_buffers 8 32k;
  client_max_body_size 50m;
  root /usr/share/nginx/html;
  index index.html;

  include /etc/nginx/snippets/security-headers.conf;

  location ~* \.map$ {
    include /etc/nginx/snippets/security-headers.conf;
    return 404;
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri $uri/ /index.html;
  }

  location = /index.html {
    include /etc/nginx/snippets/security-headers.conf;
    expires -1;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  }

  location ~* \.html$ {
    include /etc/nginx/snippets/security-headers.conf;
    expires -1;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    include /etc/nginx/snippets/security-headers.conf;
    expires 1y;
    add_header Cache-Control "public, immutable" always;
  }

  location /__dev_proxy/core/ {
    include /etc/nginx/snippets/security-headers.conf;
    proxy_ssl_server_name on;
    proxy_set_header Host estospaces-core-service-dev-zaryfkxmeq-nw.a.run.app;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass https://estospaces-core-service-dev-zaryfkxmeq-nw.a.run.app/;
  }

  location /__dev_proxy/booking/ {
    include /etc/nginx/snippets/security-headers.conf;
    proxy_ssl_server_name on;
    proxy_set_header Host estospaces-booking-service-dev-zaryfkxmeq-nw.a.run.app;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass https://estospaces-booking-service-dev-zaryfkxmeq-nw.a.run.app/;
  }

  location /__dev_proxy/payment/ {
