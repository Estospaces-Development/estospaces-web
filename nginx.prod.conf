server {
  listen 3000;
  server_tokens off;
  client_header_buffer_size 16k;
  large_client_header_buffers 8 32k;
  client_max_body_size 50m;
  root /usr/share/nginx/html;
  index index.html;

  include /etc/nginx/snippets/security-headers.conf;

  location ~* \.map$ {
    include /etc/nginx/snippets/security-headers.conf;
    return 404;
  }

  location ~ ^/(login|register|forgot-password|reset-password|verify-email)/?$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files /index.html =404;
  }

  location = /health {
    include /etc/nginx/snippets/security-headers.conf;
    default_type application/json;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    return 200 '{"status":"ok","service":"estospaces-web"}';
  }

  location = /client-geo.json {
    include /etc/nginx/snippets/security-headers.conf;
    default_type application/json;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    return 200 '{"countryCode":"$http_cf_ipcountry","cloudflareCountry":"$http_cf_ipcountry","appEngineCountry":"$http_x_appengine_country","acceptLanguage":"$http_accept_language"}';
  }

  # ── Same-origin service prefix routing ─────────────────────────────────────
  # Each /__api/<service>/ prefix is stripped before proxying. The upstream
  # receives the original /api/v1/... path.

  location /__api/core/ {
    include /etc/nginx/snippets/security-headers.conf;
    proxy_ssl_server_name on;
    proxy_set_header Host estospaces-core-service-prod-zaryfkxmeq-nw.a.run.app;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass https://estospaces-core-service-prod-zaryfkxmeq-nw.a.run.app/;
  }

  location /__api/booking/ {
    include /etc/nginx/snippets/security-headers.conf;
    proxy_ssl_server_name on;
    proxy_set_header Host estospaces-booking-service-prod-zaryfkxmeq-nw.a.run.app;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass https://estospaces-booking-service-prod-zaryfkxmeq-nw.a.run.app/;
  }

  location /__api/payment/ {
    include /etc/nginx/snippets/security-headers.conf;
    proxy_ssl_server_name on;
    proxy_set_header Host estospaces-payment-service-prod-zaryfkxmeq-nw.a.run.app;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass https://estospaces-payment-service-prod-zaryfkxmeq-nw.a.run.app/;
  }

  location /__api/notification/ {
    include /etc/nginx/snippets/security-headers.conf;
    proxy_ssl_server_name on;
    proxy_set_header Host estospaces-notification-service-prod-zaryfkxmeq-nw.a.run.app;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass https://estospaces-notification-service-prod-zaryfkxmeq-nw.a.run.app/;
  }

  location /__api/search/ {
    include /etc/nginx/snippets/security-headers.conf;
    proxy_ssl_server_name on;
    proxy_set_header Host estospaces-search-service-prod-zaryfkxmeq-nw.a.run.app;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass https://estospaces-search-service-prod-zaryfkxmeq-nw.a.run.app/;
  }

  location /__api/media/ {
    include /etc/nginx/snippets/security-headers.conf;
    proxy_ssl_server_name on;
    proxy_set_header Host estospaces-media-service-prod-zaryfkxmeq-nw.a.run.app;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass https://estospaces-media-service-prod-zaryfkxmeq-nw.a.run.app/;
  }

  location /__api/messaging/ {
    include /etc/nginx/snippets/security-headers.conf;
    proxy_ssl_server_name on;
    proxy_set_header Host estospaces-messaging-service-prod-zaryfkxmeq-nw.a.run.app;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass https://estospaces-messaging-service-prod-zaryfkxmeq-nw.a.run.app/;
  }

  # ── SPA fallback and static files ──────────────────────────────────────────

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri $uri/ /index.html;
  }

  location = /index.html {
    include /etc/nginx/snippets/security-headers.conf;
    expires -1;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  }

  location ~* \.html$ {
    include /etc/nginx/snippets/security-headers.conf;
    expires -1;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    include /etc/nginx/snippets/security-headers.conf;
    expires 1y;
    add_header Cache-Control "public, immutable" always;
  }
}
