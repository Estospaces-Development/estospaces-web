server {
  listen 3000;
  server_tokens off;
  client_header_buffer_size 16k;
  large_client_header_buffers 8 32k;
  root /usr/share/nginx/html;
  index index.html;

  include /etc/nginx/snippets/security-headers.conf;

  location ~* \.map$ {
    include /etc/nginx/snippets/security-headers.conf;
    return 404;
  }

  location ~ ^/(login|register|forgot-password|reset-password|verify-email)/?$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files /index.html =404;
  }

  location = /health {
    include /etc/nginx/snippets/security-headers.conf;
    default_type application/json;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    return 200 '{"status":"ok","service":"estospaces-web"}';
  }

  location = /client-geo.json {
    include /etc/nginx/snippets/security-headers.conf;
    default_type application/json;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    return 200 '{"countryCode":"$http_cf_ipcountry","cloudflareCountry":"$http_cf_ipcountry","appEngineCountry":"$http_x_appengine_country","acceptLanguage":"$http_accept_language"}';
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri $uri/ /index.html;
  }

  location = /index.html {
    include /etc/nginx/snippets/security-headers.conf;
    expires -1;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  }

  location ~* \.html$ {
    include /etc/nginx/snippets/security-headers.conf;
    expires -1;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    include /etc/nginx/snippets/security-headers.conf;
    expires 1y;
    add_header Cache-Control "public, immutable" always;
  }
}
