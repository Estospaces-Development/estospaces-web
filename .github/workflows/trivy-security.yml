name: Trivy Security Scan

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
  schedule:
    - cron: '19 4 * * 2'

permissions:
  contents: read

jobs:
  trivy:
    name: Trivy source security gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Vulnerability scan
        id: trivy_vuln
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table
          timeout: 10m
          skip-dirs: .git,node_modules,.tmp,.next,dist,coverage,test-results,outputs,output,.gomodcache-local,.gocache-local

      - name: Misconfiguration scan
        id: trivy_config
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          scanners: misconfig
          severity: CRITICAL,HIGH
          exit-code: '1'
          format: table
          timeout: 10m
          skip-dirs: .git,node_modules,.tmp,.next,dist,coverage,test-results,outputs,output,.gomodcache-local,.gocache-local

      - name: Enforce Trivy gates
        if: always()
        run: |
          failed=0
          if [ "${{ steps.trivy_vuln.outcome }}" != "success" ]; then
            echo "Trivy vulnerability scan found high or critical findings."
            failed=1
          fi
          if [ "${{ steps.trivy_config.outcome }}" != "success" ]; then
            echo "Trivy misconfiguration scan found high or critical findings."
            failed=1
          fi
          exit $failed