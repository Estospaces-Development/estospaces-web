name: Frontend CI/CD

on:
  push:
    branches: [local, develop, main]
  pull_request:
    branches: [develop, main]

env:
  GCP_REGION: europe-west2

jobs:
  build-test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Run tests when the script exists
        run: |
          if node -e "const pkg=require('./package.json'); process.exit(pkg.scripts && pkg.scripts.test ? 0 : 1)"; then
            npm run test
          else
            echo "Skipping tests because package.json has no test script."
          fi
      - run: npm run lint -- .
      - run: npm run build
