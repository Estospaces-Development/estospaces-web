name: Frontend CI/CD

on:
  push:
    branches: [local, develop, main]
  pull_request:
    branches: [develop, main]

env:
  GCP_REGION: europe-west2
  VITE_CORE_SERVICE_URL: https://core.estospaces.invalid
  VITE_BOOKING_SERVICE_URL: https://booking.estospaces.invalid
  VITE_NOTIFICATION_SERVICE_URL: https://notification.estospaces.invalid
  VITE_PAYMENT_SERVICE_URL: https://payment.estospaces.invalid
  VITE_SEARCH_SERVICE_URL: https://search.estospaces.invalid
  VITE_MEDIA_SERVICE_URL: https://media.estospaces.invalid
  VITE_MESSAGING_SERVICE_URL: https://messaging.estospaces.invalid

permissions:
  contents: read

jobs:
  build-test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: node scripts/audit-production-dependencies.mjs
      - name: Run tests when the script exists
        run: |
          if node -e "const pkg=require('./package.json'); process.exit(pkg.scripts && pkg.scripts.test ? 0 : 1)"; then
            npm run test
          else
            echo "Skipping tests because package.json has no test script."
          fi
      - run: npm run lint -- . --max-warnings=0
      - run: npm run typecheck
      - run: npm run build
      - name: Verify documentation table layout at mobile and desktop widths
        run: |
          npx playwright install --with-deps chromium
          npx tsx --test scripts/docs-mobile-layout-proof.tsx
      - name: Build hardened Docker image
        run: |
          docker build \
            --build-arg VITE_CORE_SERVICE_URL="${VITE_CORE_SERVICE_URL}" \
            --build-arg VITE_BOOKING_SERVICE_URL="${VITE_BOOKING_SERVICE_URL}" \
            --build-arg VITE_PAYMENT_SERVICE_URL="${VITE_PAYMENT_SERVICE_URL}" \
            --build-arg VITE_NOTIFICATION_SERVICE_URL="${VITE_NOTIFICATION_SERVICE_URL}" \
            --build-arg VITE_SEARCH_SERVICE_URL="${VITE_SEARCH_SERVICE_URL}" \
            --build-arg VITE_MEDIA_SERVICE_URL="${VITE_MEDIA_SERVICE_URL}" \
            --build-arg VITE_MESSAGING_SERVICE_URL="${VITE_MESSAGING_SERVICE_URL}" \
            -t test-estospaces-web:${{ github.sha }} .
